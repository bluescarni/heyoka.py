[build-system]
build-backend = 'scikit_build_core.build'
requires = ['scikit-build-core', 'pybind11 >= 3, < 4', 'numpy >= 2, < 3']

[project]
name = 'heyoka'
version = '7.12.1'
description = "Python library for ODE integration via Taylor's method and LLVM"
readme = 'README.md'
requires-python = '>=3.10'
# NOTE: the certifi dep is specific to pyproject.toml. We use it in order to provide
# an alternate SSL verify file in case the openssl library vendored into the wheel
# is unable to use the system's certificate store due to path mismatches.
dependencies = ['cloudpickle', 'numpy >= 2, < 3', 'certifi']
authors = [{ name = 'Francesco Biscani', email = 'bluescarni@gmail.com' }]
# NOTE: SPDX license expression + license file (PEP 639).
license = "MPL-2.0"
license-files = ["LICENSE"]
classifiers = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
keywords = ['science', 'math', 'physics', 'ode']

[project.urls]
Documentation = "https://bluescarni.github.io/heyoka.py/index.html"
Repository = "https://github.com/bluescarni/heyoka.py"

[project.optional-dependencies]
sympy = ["sympy", "mpmath"]
sgp4 = ["skyfield"]

# Development/CI dependency groups (PEP 735). These are NOT part of the wheel
# metadata - they describe how to set up a local/CI environment, not optional
# runtime features of the package. The "test" group pulls in pytest plus the
# optional-feature extras, so that "pip install --group test" provides everything
# needed to run the full suite (otherwise the sympy/sgp4 tests would be skipped).
[dependency-groups]
test = ["pytest", "heyoka[sympy,sgp4]"]

[tool.pytest.ini_options]
# NOTE: "-ra" prints a summary of skipped/xfailed tests at the end.
addopts = "-ra"

[tool.scikit-build]
# Avoid copying the C++ source files when building
# binary wheels.
wheel.packages = []
# Enable IPO.
cmake.define.HEYOKA_PY_ENABLE_IPO = "ON"
# Do not include the docs in the sdist.
sdist.exclude = ["doc"]
